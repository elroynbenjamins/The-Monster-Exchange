<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Monster Exchange — Region Navigation</title>
  <link rel="stylesheet" href="/prototype/world-map/world-map.css">
  <link rel="stylesheet" href="/prototype/world-map/region-map.css">
  <link rel="stylesheet" href="/assets/styles/android-ui.css">
</head>
<body>
  <main class="world-shell" aria-label="Region navigation">
    <header class="topbar">
      <div><p class="eyebrow">Exchange Guild Navigation</p><h1 id="pageTitle">Region Map</h1></div>
      <div class="resources"><span><b>Day 1</b></span><span>◆ <b>250</b> Crowns</span><a class="ghost-button map-link" href="/prototype/world-map/">Return to world</a></div>
    </header>
    <nav class="breadcrumbs" aria-label="Map breadcrumbs">
      <a href="/prototype/world-map/">World</a><span>›</span><a href="/prototype/world-map/" id="continentCrumb"></a><span>›</span><strong id="regionCrumb"></strong>
    </nav>
    <section class="navigation-layout region-layout">
      <aside class="destination-panel" aria-labelledby="siteListTitle">
        <div class="panel-heading"><p class="eyebrow">Region locations</p><h2 id="siteListTitle">Sites</h2></div>
        <div id="siteList" class="destination-list"></div>
        <section class="border-panel" aria-labelledby="borderTitle"><p class="eyebrow">Borders & exits</p><h3 id="borderTitle">Connected regions</h3><div id="borderList"></div></section>
      </aside>
      <section class="map-stage region-stage" id="regionStage" aria-label="Interactive region map">
        <img id="regionImage" alt="" draggable="false">
        <svg id="regionRouteLayer" class="route-layer" viewBox="0 0 1000 667" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="siteHotspotLayer" class="hotspot-layer"></div>
        <p class="map-help">Select a location or border exit. Every marker uses v47 map coordinates.</p>
      </section>
      <aside class="region-panel" aria-live="polite">
        <div class="region-hero"><span id="siteIcon">◆</span><div><p id="siteKind">Location</p><h2 id="siteName"></h2></div></div>
        <p id="siteDescription" class="region-description"></p>
        <dl class="region-stats"><div><dt>Region</dt><dd id="siteRegion"></dd></div><div><dt>Function</dt><dd id="siteFunction"></dd></div><div><dt>Status</dt><dd>Available</dd></div></dl>
        <div id="siteSummary" class="travel-summary"></div>
        <button id="siteAction" class="travel-button" type="button">Open location</button>
        <a class="secondary-button map-link back-link" href="/prototype/world-map/">Back to world map</a>
      </aside>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="/prototype/world-map/region-map.js"></script>
</body>
</html>
